[project]
name = "codex-plugins"
version = "0.1.0"
description = "Development and testing environment for script-based Codex hooks"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.pyright]
include = ["plugins", "tests"]
extraPaths = ["plugins/tmp-redirect-approval/hooks"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["plugins/tmp-redirect-approval/hooks"]
addopts = ["-q", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
